<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>エチオピアの観光名所 | Echiopia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/script.js" defer></script>
</head>
<body>

<header class="site-header">
  <nav class="site-nav">
    <a href="#recommend">私のおすすめのスポット紹介</a>
    <a href="#spots">スポット紹介</a>
    <a href="#profile">著者プロフィール</a>
  </nav>
</header>

<div class="hero">
  <div class="hero-track">
    <img src="assets/images/hero-azwa-mariam.png" alt="アズワ・マリアム教会の壁画">
    <img src="assets/images/spot-st-george-church-2.png" alt="聖ジョージ教会の空撮">
    <img src="assets/images/dallol-wonders-2.png" alt="ダロルの奇観">
    <img src="assets/images/simien-mountains.png" alt="シミエン山地のレッドホットポーカーの花">
    <img src="assets/images/dallol-clients-2.png" alt="ダナキルの絶景を眺める旅行者たち">
    <img src="assets/images/dallol-clients-1.png" alt="ダナキルの絶景を眺める旅行者たち">
    <img src="assets/images/dallol-wonders-3.png" alt="ダロル奇観の風景">
    <img src="assets/images/hero-azwa-mariam.png" alt="" aria-hidden="true">
    <img src="assets/images/spot-st-george-church-2.png" alt="" aria-hidden="true">
    <img src="assets/images/dallol-wonders-2.png" alt="" aria-hidden="true">
    <img src="assets/images/simien-mountains.png" alt="" aria-hidden="true">
    <img src="assets/images/dallol-clients-2.png" alt="" aria-hidden="true">
    <img src="assets/images/dallol-clients-1.png" alt="" aria-hidden="true">
    <img src="assets/images/dallol-wonders-3.png" alt="" aria-hidden="true">
  </div>
</div>

<main>
  <section id="recommend" class="section">
    <h2 class="section-title">私のおすすめのスポット紹介</h2>
    <div class="recommend-grid">
      <article class="recommend-card">
        <img src="assets/images/spot-st-george-church.png" alt="聖ジョージ教会の空撮">
        <h3>スポットA</h3>
        <p>スポットの内容記載</p>
        <p>xxxxxxxxxxxxxxx</p>
      </article>
      <article class="recommend-card">
        <img src="assets/images/dallol-wonders-3.png" alt="ダロル奇観の風景">
        <h3>スポットB</h3>
        <p>スポットの内容記載</p>
      </article>
    </div>
  </section>

  <section id="spots" class="section">
    <h2 class="section-title section-title--small">エチオピアの観光名所</h2>
    <div class="spots-grid">
      <article class="spot-card spot-card--c1r1" tabindex="0" role="button" aria-haspopup="dialog"
        data-title="スポットA" data-description="スポットの内容記載" data-image="assets/images/spot-st-george-church-2.png">
        <img src="assets/images/spot-st-george-church-2.png" alt="聖ジョージ教会の空撮">
        <h3>スポットA</h3>
        <p>スポットの内容記載</p>
      </article>
      <article class="spot-card spot-card--c2r1" tabindex="0" role="button" aria-haspopup="dialog"
        data-title="スポットA" data-description="スポットの内容記載" data-image="assets/images/dallol-wonders-2.png">
        <img src="assets/images/dallol-wonders-2.png" alt="ダロルの奇観">
        <h3>スポットA</h3>
        <p>スポットの内容記載</p>
      </article>
      <article class="spot-card spot-card--c3r1" tabindex="0" role="button" aria-haspopup="dialog"
        data-title="スポットA" data-description="スポットの内容記載" data-image="assets/images/simien-mountains.png">
        <img src="assets/images/simien-mountains.png" alt="シミエン山地のレッドホットポーカーの花">
        <h3>スポットA</h3>
        <p>スポットの内容記載</p>
      </article>
      <article class="spot-card spot-card--c1r2" tabindex="0" role="button" aria-haspopup="dialog"
        data-title="スポットA" data-description="スポットの内容記載" data-image="assets/images/dallol-clients-2.png">
        <img src="assets/images/dallol-clients-2.png" alt="ダナキルの絶景を眺める旅行者たち">
        <h3>スポットA</h3>
        <p>スポットの内容記載</p>
      </article>
      <article class="spot-card spot-card--c2r2" tabindex="0" role="button" aria-haspopup="dialog"
        data-title="スポットA" data-description="スポットの内容記載" data-image="assets/images/dallol-clients-1.png">
        <img src="assets/images/dallol-clients-1.png" alt="ダナキルの絶景を眺める旅行者たち">
        <h3>スポットA</h3>
        <p>スポットの内容記載</p>
      </article>
      <article class="spot-card spot-card--c3r2" tabindex="0" role="button" aria-haspopup="dialog"
        data-title="スポットA" data-description="スポットの内容記載" data-image="assets/images/dallol-wonders-3.png">
        <img src="assets/images/dallol-wonders-3.png" alt="ダロル奇観の風景">
        <h3>スポットA</h3>
        <p>スポットの内容記載</p>
      </article>
    </div>
  </section>
</main>

<div class="modal-overlay" id="spotModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button type="button" class="modal-close" id="modalClose" aria-label="閉じる">&times;</button>
    <img class="modal-image" id="modalImage" src="" alt="">
    <h3 id="modalTitle"></h3>
    <p id="modalDescription"></p>
  </div>
</div>

<footer id="profile" class="profile-section">
  <h2 class="section-title section-title--small">投稿者のプロフィール</h2>
  <div class="profile-content">
    <img class="profile-avatar" src="assets/images/profile-avatar.svg" alt="投稿者のアバター">
    <div class="profile-info">
      <p class="profile-name">鎌田　りゅうせい</p>
      <p>福岡県出身</p>
      <p>ここにプロフィール内容記載</p>
      <p>趣味なども記載</p>
    </div>
  </div>
</footer>

</body>
</html>
